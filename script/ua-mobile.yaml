# 名称: ua-mobile
# 说明: 请求 UA 伪装为移动版 Safari
# 注意: 默认停用。会改写全部请求的 User-Agent，部分站点可能因此触发风控。
# 适用引擎: stash

script-providers:
  ua-mobile:
    interval: 86400
    payload: |
      $request.headers["User-Agent"] = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1";
      $done();

script:
  - type: request
    name: ua-mobile
    match: "^https?://"
